<script>
  (function () {
    try {
      var stored = localStorage.getItem('ml.theme');
      if (stored === 'dark' || stored === 'light') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (err) { }
  })();
</script>

<a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>
<header class="navbar" id="navbar">
  <div class="navbar-inner header-inner">
    <a class="navbar-brand" href="index.html" aria-label="MyLinguistics">
      <span class="brand-mark" aria-hidden="true">ML</span>
    </a>
    <span class="navbar-compact-title">MyLinguistics</span>
    <div class="navbar-actions">
      <button class="icon-btn" id="themeToggle" type="button">Dark</button>
      <button class="icon-btn icon-btn-glyph" id="shellMore" type="button" aria-haspopup="dialog" aria-label="More" data-i18n-aria="shell.more">⋯</button>
    </div>
  </div>
</header>
<div class="navbar-large">
  <h1 class="large-title" data-i18n="overview.title">Overview</h1>

</div>
<main id="main">

  <section class="section">
    <div class="container">
      <div class="wb-review-top">
        <span class="pill pill-accent" id="ovPoolCount">0</span>
        <span class="pill" id="ovBrickCount">0</span>
        <span class="pill" id="ovDueCount">0</span>
      </div>

      <div class="panel">
        <h2 class="panel-title" data-i18n="overview.pool">Word pool</h2>
        <div id="ovPool"></div>
      </div>

      <div class="panel">
        <h2 class="panel-title" data-i18n="overview.bricks">Bricks</h2>
        <div class="row-actions">
          <button class="btn btn-primary btn-small" id="ovBuild" type="button" data-i18n="overview.build">Build bricks</button>
        </div>
        <div id="ovBricks"></div>
      </div>

      <div class="panel">
        <h2 class="panel-title" data-i18n="overview.data">Data</h2>
        <p class="muted mb-0" data-i18n="overview.dataNote">Mining, frequency lists, dictionaries, and backup stay on the wordbook page until the overview is built.</p>
      </div>
    </div>
  </section>

</main>
