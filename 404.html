<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyLinguistics">
<title>Page not found - MyLinguistics</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/shell.css">
<script>
  (function () {
    try {
      var stored = localStorage.getItem('ml.theme');
      if (stored === 'dark' || stored === 'light') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (err) { }
  })();
</script>
</head>
<body>
<main id="main">
  <section class="section">
    <div class="container center" style="padding:60px 0;">
      <p class="eyebrow">Error 404</p>
      <h1>This page is missing.</h1>
      <p class="lede" style="margin:0 auto 24px;">The link may be wrong, or the page may have moved. Head back to a deck instead.</p>
      <div class="hero-actions" style="justify-content:center;">
        <a class="btn btn-primary" href="index.html">Back home</a>
        <a class="btn btn-secondary" href="study.html">Start studying</a>
      </div>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <p>MyLinguistics - a personal language-learning workspace.</p>
  </div>
</footer>
</body>
</html>
