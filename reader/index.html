<!DOCTYPE html>
<html lang="ja" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reader">
<title>Reader - MyLinguistics</title>
<link rel="stylesheet" href="reader.css?v=12">
</head>
<body>

<header id="bar">
  <button id="btn-open" type="button">ファイル</button>
  <button id="btn-sample" type="button">サンプル</button>
  <div id="book-title">リーダー</div>
  <button id="btn-toc" type="button">目次</button>
  <button id="btn-dict" type="button">辞書</button>
  <button id="btn-bookmark" type="button">しおり</button>
  <button id="btn-settings" type="button">表示</button>
</header>

<main id="viewport" class="vertical" tabindex="0" aria-label="本文">
  <article id="content"></article>
  <div id="empty">
    <p>「ファイル」から本棚を開くか、サンプルを表示してください。</p>
    <p class="hint">開いた本・縦書き横書き・文字サイズ・読んでいた位置は、この端末に保存されます。</p>
  </div>
</main>

<!-- Reading position. A sibling of #viewport and after it, because the
     stylesheet tells vertical writing apart with #viewport.vertical ~ #rail
     and flips the fill's origin to the right in that mode. The reader only
     moves --progress; the rail has no styling of its own here, so it is
     invisible until reader/reader.css draws it. See interface-shell.md 0.4. -->
<div id="rail" role="progressbar" aria-label="読書位置"
     aria-valuemin="1" aria-valuemax="1" aria-valuenow="1">
  <div id="rail-fill"></div>
</div>

<div id="note-markers" aria-hidden="true"></div>

<footer id="foot">
  <button id="btn-prev" type="button" aria-label="前のページ">&lsaquo;</button>
  <span id="page-info">- / -</span>
  <button id="btn-next" type="button" aria-label="次のページ">&rsaquo;</button>
  <span class="spacer"></span>
  <span id="build" title="読み込まれている版">html r12</span>
  <button id="btn-smaller" type="button">A&minus;</button>
  <button id="btn-larger" type="button">A&plus;</button>
</footer>

<div id="dict" hidden>
  <div class="dict-head">
    <button id="dict-back" type="button" aria-label="前の語に戻る" hidden>&larr;</button>
    <div id="dict-title">
      <strong id="dict-surface"></strong>
      <span id="dict-reading"></span>
    </div>
    <button id="dict-prev" type="button" aria-label="前の語">&lsaquo;</button>
    <button id="dict-next" type="button" aria-label="次の語">&rsaquo;</button>
    <button id="dict-close" type="button">閉じる</button>
  </div>
  <div id="dict-body"></div>
</div>

<div id="hover-bubble" hidden>
  <strong id="hover-word"></strong>
  <span id="hover-reading"></span>
</div>

<div id="select-bar" hidden>
  <span id="select-info"></span>
  <button id="select-note" type="button">メモ</button>
  <button id="select-highlight" type="button">蛍光</button>
  <button id="select-copy" type="button">コピー</button>
  <button id="select-dict" type="button">辞書</button>
  <button id="select-clear" type="button">解除</button>
</div>

<div id="overlay" hidden>
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <strong id="sheet-title">目次</strong>
      <button id="btn-close-sheet" type="button">閉じる</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<input type="file" id="file-input" accept=".epub,application/epub+zip" hidden>
<input type="file" id="dict-input" accept=".zip,application/zip,application/x-zip-compressed" hidden>

<script type="module" src="js/app.js?v=12"></script>
</body>
</html>
